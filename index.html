
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algorithm Arena</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Algorithm Arena</h1>
        <p>Explore how algorithms find their way.</p>
    </header>

    <main>

        <section class="controls">

            <button id="startBtn">Set Start</button>
            <button id="endBtn">Set End</button>
            <button id="wallBtn">Draw Walls</button>
            <button id="mudBtn">Draw Mud</button>
            <button id="clearBtn">Clear Walls</button>
            <button id="bfsBtn">Run BFS</button>
            <button id="dfsBtn">Run DFS</button>
            <button id="dijkstraBtn">Run Dijkstra</button>

        </section>

        <p id="message">
            Select a mode and click a cell.
        </p>

        <div id="grid"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
